<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Profile ✨</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 20%,#fff3a0 0%,#d89b00 25%,#6b4200 55%,#140c00 100%);
  color:white;
}

body::before{
  content:"";
  position:fixed;
  inset:-50%;
  background:repeating-conic-gradient(
    from 0deg,
    transparent 0deg 8deg,
    rgba(255,220,80,.12) 9deg 10deg
  );
  animation:spin 18s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.card{
  position:relative;
  z-index:2;
  width:90%;
  max-width:390px;
  padding:30px 22px;
  text-align:center;
  border:1px solid rgba(255,225,100,.8);
  border-radius:30px;
  background:rgba(35,20,0,.72);
  backdrop-filter:blur(18px);
  box-shadow:
    0 0 25px #ffd83d,
    0 0 80px rgba(255,180,0,.45),
    inset 0 0 30px rgba(255,215,70,.12);
}

.avatar{
  width:120px;
  height:120px;
  margin:auto;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
  background:linear-gradient(135deg,#fff6a0,#ffc400,#8c5700);
  border:4px solid #ffe66b;
  box-shadow:
    0 0 15px #fff0a0,
    0 0 45px #ffb900;
}

h1{
  margin-top:18px;
  font-size:27px;
  color:#ffe77a;
  text-shadow:0 0 12px #ffc400;
}

.username{
  margin-top:7px;
  color:#fff1a8;
  font-size:14px;
}

.bio{
  margin:20px 0;
  padding:13px;
  border-radius:15px;
  background:rgba(255,200,40,.1);
  border:1px solid rgba(255,220,90,.3);
  color:#fff7cf;
}

.button{
  display:block;
  width:100%;
  padding:16px;
  border-radius:16px;
  text-decoration:none;
  font-weight:bold;
  font-size:17px;
  color:#4b2c00;
  background:linear-gradient(
    90deg,
    #fff1a1,
    #ffd21f,
    #fff0a0,
    #d99a00
  );
  background-size:300% 100%;
  animation:gold 3s linear infinite;
  box-shadow:0 0 20px rgba(255,210,30,.7);
  transition:.25s;
}

.button:hover{
  transform:scale(1.04);
  box-shadow:0 0 35px #ffe05a;
}

@keyframes gold{
  0%{background-position:0%}
  100%{background-position:300%}
}

.note{
  margin-top:15px;
  font-size:12px;
  color:#ffeeb0;
  opacity:.8;
}

.sparkle{
  position:fixed;
  color:#fff4a3;
  font-size:18px;
  animation:float 4s linear infinite;
  z-index:1;
}

@keyframes float{
  0%{
    transform:translateY(110vh) rotate(0);
    opacity:0;
  }
  20%{opacity:1}
  100%{
    transform:translateY(-10vh) rotate(360deg);
    opacity:0;
  }
}
</style>
</head>

<body>

<div class="sparkle" style="left:10%;animation-delay:0s">✦</div>
<div class="sparkle" style="left:25%;animation-delay:1s">✧</div>
<div class="sparkle" style="left:45%;animation-delay:2s">✦</div>
<div class="sparkle" style="left:65%;animation-delay:.5s">✧</div>
<div class="sparkle" style="left:85%;animation-delay:1.5s">✦</div>

<div class="card">

  <div class="avatar">💗</div>

  <h1>XtinhIOS x GPT ✨</h1>

  <div class="username">
    @adminxtinhiosdz
  </div>

  <div class="bio">
    💛 Profile Locket VIP 💛<br>
    ✨ Mua Profile Liên Hệ Admin ✨
  </div>

  <a
    class="button"
    href="https://locket.cam/linmmci"
    target="_blank"
    rel="noopener noreferrer"
  >
    💛 Gửi kết bạn cho người Admin ( XtinhIOS DZ )
  </a>

  <div class="note">
    Nhấn nút để mở profile Locket và gửi kết bạn
  </div>

</div>

</body>
</html>
